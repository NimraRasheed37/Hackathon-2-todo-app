apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: todo-backend-config
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: http://zipkin:9411/api/v2/spans
  metric:
    enabled: true
  logging:
    level: info
    apiLogging:
      enabled: true
      obfuscateURLs: false
  mtls:
    enabled: false
  features:
    - name: "component.statestore"
      enabled: true
    - name: "component.pubsub"
      enabled: true
