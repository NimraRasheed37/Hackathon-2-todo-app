# Helm values.yaml Schema
# Defines the structure for Helm chart configuration

type: object
required:
  - global
  - frontend
  - backend
  - ingress
  - config
  - secrets

properties:
  global:
    type: object
    properties:
      environment:
        type: string
        enum: [local, development, staging, production]
        default: local

  frontend:
    type: object
    required: [name, replicas, image, service, resources, probes]
    properties:
      name:
        type: string
        default: todo-frontend
      replicas:
        type: integer
        minimum: 1
        default: 2
      image:
        type: object
        properties:
          repository:
            type: string
            default: todo-frontend
          tag:
            type: string
            default: latest
          pullPolicy:
            type: string
            enum: [Always, IfNotPresent, Never]
            default: IfNotPresent
      service:
        type: object
        properties:
          type:
            type: string
            enum: [ClusterIP, NodePort, LoadBalancer]
            default: ClusterIP
          port:
            type: integer
            default: 3000
      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              memory:
                type: string
                default: "128Mi"
              cpu:
                type: string
                default: "100m"
          limits:
            type: object
            properties:
              memory:
                type: string
                default: "256Mi"
              cpu:
                type: string
                default: "200m"
      probes:
        type: object
        properties:
          liveness:
            type: object
            properties:
              path:
                type: string
                default: /api/health
              initialDelaySeconds:
                type: integer
                default: 10
              periodSeconds:
                type: integer
                default: 10
          readiness:
            type: object
            properties:
              path:
                type: string
                default: /api/health
              initialDelaySeconds:
                type: integer
                default: 5
              periodSeconds:
                type: integer
                default: 5

  backend:
    type: object
    required: [name, replicas, image, service, resources, probes]
    properties:
      name:
        type: string
        default: todo-backend
      replicas:
        type: integer
        minimum: 1
        default: 2
      image:
        type: object
        properties:
          repository:
            type: string
            default: todo-backend
          tag:
            type: string
            default: latest
          pullPolicy:
            type: string
            enum: [Always, IfNotPresent, Never]
            default: IfNotPresent
      service:
        type: object
        properties:
          type:
            type: string
            enum: [ClusterIP, NodePort, LoadBalancer]
            default: ClusterIP
          port:
            type: integer
            default: 8000
      resources:
        type: object
        properties:
          requests:
            type: object
            properties:
              memory:
                type: string
                default: "256Mi"
              cpu:
                type: string
                default: "200m"
          limits:
            type: object
            properties:
              memory:
                type: string
                default: "512Mi"
              cpu:
                type: string
                default: "400m"
      probes:
        type: object
        properties:
          liveness:
            type: object
            properties:
              path:
                type: string
                default: /health
              initialDelaySeconds:
                type: integer
                default: 15
              periodSeconds:
                type: integer
                default: 10
          readiness:
            type: object
            properties:
              path:
                type: string
                default: /ready
              initialDelaySeconds:
                type: integer
                default: 10
              periodSeconds:
                type: integer
                default: 5

  ingress:
    type: object
    properties:
      enabled:
        type: boolean
        default: true
      className:
        type: string
        default: nginx
      host:
        type: string
        default: todo.local
      annotations:
        type: object
        additionalProperties:
          type: string

  config:
    type: object
    description: Non-sensitive configuration (stored in ConfigMap)
    properties:
      apiUrl:
        type: string
        default: http://todo-backend:8000
      frontendUrl:
        type: string
        default: http://todo.local
      corsOrigins:
        type: string
        default: http://todo.local
      logLevel:
        type: string
        enum: [debug, info, warning, error]
        default: info

  secrets:
    type: object
    description: Sensitive configuration (stored in Secret, base64 encoded)
    properties:
      databaseUrl:
        type: string
        description: PostgreSQL connection string
      openaiApiKey:
        type: string
        description: OpenAI API key
      jwtSecret:
        type: string
        description: JWT signing secret
      betterAuthSecret:
        type: string
        description: Better Auth secret key
