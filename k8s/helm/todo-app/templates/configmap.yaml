apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.configmap.name" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  NEXT_PUBLIC_API_URL: {{ .Values.config.apiUrl | quote }}
  BETTER_AUTH_URL: {{ .Values.config.frontendUrl | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
