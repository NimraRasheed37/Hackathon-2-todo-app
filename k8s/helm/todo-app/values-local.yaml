# Local development overrides for todo-app Helm chart
# Use with: helm upgrade --install todo ./k8s/helm/todo-app -f ./k8s/helm/todo-app/values-local.yaml

global:
  environment: local

# Use fewer replicas for local development
frontend:
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

backend:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Local ingress settings
ingress:
  enabled: true
  host: todo.local
