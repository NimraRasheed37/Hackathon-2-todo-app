apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: todo-app
spec:
  type: state.redis
  version: v1
  metadata:
    # Redis host address
    - name: redisHost
      value: "redis:6379"
    # Redis password (from secret in production)
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: password
    # Enable TTL for state entries
    - name: enableTLS
      value: "false"
    # Fail on error (vs. returning nil)
    - name: failover
      value: "false"
    # Key prefix for namespacing
    - name: keyPrefix
      value: "todo"
    # Concurrency mode
    - name: actorStateStore
      value: "false"
scopes:
  - backend
  - recurring-service
  - reminder-service
