apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-ingress
  labels:
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: todo.local
      http:
        paths:
          # API routes go to backend
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000
          # Health endpoint for backend
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000
          # Ready endpoint for backend
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: todo-backend
                port:
                  number: 8000
          # All other routes go to frontend
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: todo-frontend
                port:
                  number: 3000
