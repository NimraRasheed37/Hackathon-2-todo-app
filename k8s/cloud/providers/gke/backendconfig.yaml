---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: todo-backend-config
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 8000
  cdn:
    enabled: false
  logging:
    enable: true
    sampleRate: 0.5
