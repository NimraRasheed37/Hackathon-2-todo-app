---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: todo-app-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: todo-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: todo-app-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: todo-frontend
