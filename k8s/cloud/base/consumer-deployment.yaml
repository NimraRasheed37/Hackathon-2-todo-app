---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-deployment
  labels:
    app: consumer
    app.kubernetes.io/name: todo-consumer
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
        app.kubernetes.io/name: todo-consumer
      annotations:
        # Dapr annotations for sidecar injection
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-consumer"
        dapr.io/app-port: "3500"
        dapr.io/enable-api-logging: "true"
        dapr.io/log-level: "info"
        dapr.io/config: "todo-config"
    spec:
      serviceAccountName: todo-consumer
      containers:
        - name: consumer
          image: ghcr.io/your-org/todo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3500
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: database-url
            - name: DAPR_ENABLED
              value: "true"
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: RUN_MODE
              value: "consumer"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3500
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3500
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-consumer
  labels:
    app: consumer
